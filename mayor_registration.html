<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Son Solar - Registration</title>
 
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
 
        body {
            background: #b2daec;
            color: #222;
        }
        .container {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
 
        .register-card {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(92, 90, 90, 0.1);
        }
 
        .register-card h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }
 
        .subtitle {
            text-align: center;
            color: #999faa;
            margin-bottom: 40px;
        }
 
        .form-group {
            margin-bottom: 22px;
        }
 
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: 500;
        }
 
        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
 
        .register-btn {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #b2daec;
            color: rgb(250, 248, 248);
            font-size: 18px;
            font-weight: bold;
        }
 
    </style>
</head>
 
<body>

    <main class="container">
 
        <div class="register-card">
 
            <h2>Register Account</h2>
            <p class="subtitle">
                Please fill in the details to register.
            </p>
 
            <form id="registrationForm">
 
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        placeholder="Enter your full name"
                        required
                    >
                </div>
 
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>
 
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>
 
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>
 
                <button type="submit" class="register-btn">
                    Register
                </button>
 
            </form>

 
        </div>
 
    </main>
 
</body>
</html>
